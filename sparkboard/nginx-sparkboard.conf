# Sparkboard nginx route.
#
# The installer writes this to /etc/nginx/snippets/sparkboard.conf. This copy
# is here so you can read it before installing, or paste it by hand.
#
# Add inside the SAME server{} block that already proxies Open WebUI:
#     include /etc/nginx/snippets/sparkboard.conf;

location = /gpu { return 301 /gpu/; }

location /gpu/ {
    # The trailing slash matters: it makes nginx strip the /gpu/ prefix before
    # forwarding. The dashboard requests every asset and API path relatively,
    # so it doesn't care what prefix it's mounted under.
    proxy_pass http://127.0.0.1:9101/;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # The live view is server-sent events. Without these nginx buffers the
    # stream and the dashboard sits there looking frozen.
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 24h;
    chunked_transfer_encoding off;

    # Optional: restrict to campus/VPN ranges.
    # allow 10.0.0.0/8;
    # allow 131.123.0.0/16;
    # deny all;
}

