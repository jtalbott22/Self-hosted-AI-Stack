# Sparkboard route for a Windows nginx reverse proxy.
#
# Paste this inside the same server{} block that already proxies Open WebUI,
# then reload: nginx -s reload
#
# (The Linux/systemd equivalent, which mounts at /gpu/ on port 9101, is in
# nginx-sparkboard.conf.)

location = /sparkboard { return 301 /sparkboard/; }

location /sparkboard/ {
    # The trailing slash matters: it makes nginx strip the /sparkboard/ prefix
    # before forwarding. Every asset and API path in the dashboard is
    # requested relatively, so it doesn't care what prefix it's mounted under.
    proxy_pass http://127.0.0.1:9102/;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # The live view is server-sent events. Without these nginx buffers the
    # stream and the dashboard sits there looking frozen while the numbers in
    # the polled tables keep moving -- a confusing failure to diagnose.
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 24h;
    chunked_transfer_encoding off;
}

# Sparkboard has no authentication of its own, and the ports table is a map of
# everything listening on the box. If that hostname answers from outside the
# network, put something in front of it -- basic auth:
#
#     auth_basic "Sparkboard";
#     auth_basic_user_file C:/nginx/conf/sparkboard.htpasswd;
#
# or an address restriction:
#
#     allow 192.168.0.0/16;
#     deny  all;
