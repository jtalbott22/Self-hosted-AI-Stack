# "Sign in with Google" for the avatar on a public nginx, instead of a
# password, with the avatar-signin container (oauth2-proxy) from
# docker-compose.yaml. Only the Google accounts listed in
# avatar/oauth2/allowed-emails.txt get in; the LAN walks straight in.
#
# Before reloading nginx:
#   1. Google Cloud console > APIs & Services > Credentials > Create
#      credentials > OAuth client ID > Web application. Authorized redirect
#      URI: https://<your site>/avatar/oauth2/callback (AVATAR_PUBLIC_URL +
#      /oauth2/callback). On the OAuth consent screen, publish the app
#      ("In production"): with only the basic email/profile scopes Google
#      doesn't review it, and in "Testing" sign-ins lapse after 7 days.
#   2. In .env: AVATAR_GOOGLE_CLIENT_ID, AVATAR_GOOGLE_CLIENT_SECRET, and
#      AVATAR_COOKIE_SECRET (any 32 random bytes, base64:
#      head -c 32 /dev/urandom | base64 | tr '+/' '-_').
#   3. docker compose up -d avatar-signin
#   4. Behind a CDN (CloudFront), the /avatar* behavior must pass cookies
#      and query strings to the origin, and must not cache.
#
# In the avatar's config (avatar-app.conf on Windows), at server level:

location @avatar_signin {
    return 302 /avatar/oauth2/start?rd=$request_uri;
}

location /avatar/ {
    # LAN or Google. Behind a CDN, the public server must set the visitor's
    # address from X-Forwarded-For (see nginx-authgate.conf), or the CDN's
    # address is what "allow" sees. This auth_request replaces a server-level
    # one (authgate) for everything under /avatar/.
    satisfy any;
    allow 192.168.0.0/16;
    allow 127.0.0.1;
    deny  all;
    auth_request /avatar/oauth2/auth;
    auth_request_set $avatar_user $upstream_http_x_auth_request_email;
    error_page 401 = @avatar_signin;

    # Saved chats (avatar-chats), per Google account. X-Avatar-User is
    # always set from the sign-in (empty on the LAN), so a browser can't
    # claim someone else's. Needs --set-xauthrequest on avatar-signin.
    location /avatar/chats/ {
        proxy_pass http://127.0.0.1:8706/chats/;
        proxy_set_header X-Avatar-User $avatar_user;
        proxy_set_header Authorization "";
        client_max_body_size 8m;
    }
    location = /avatar/chats/me {
        proxy_pass http://127.0.0.1:8706/me;
        proxy_set_header X-Avatar-User $avatar_user;
        proxy_set_header Authorization "";
    }

    # ... alias, index and the service locations as before; they inherit
    # the gate. Drop auth_basic / auth_basic_user_file.

    location /avatar/oauth2/ {
        allow all;
        auth_request off;
        proxy_pass http://127.0.0.1:4180;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header Authorization     "";
    }
    location = /avatar/oauth2/auth {
        internal;
        allow all;
        auth_request off;
        proxy_pass http://127.0.0.1:4180;
        proxy_pass_request_body off;
        proxy_set_header Content-Length    "";
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Uri   $request_uri;
        proxy_set_header Authorization     "";
    }
}

# Then: nginx -t, and reload (on Windows, from an admin prompt:
# cd C:\nginx; .\nginx.exe -s reload).
#
# Who's allowed:  edit avatar/oauth2/allowed-emails.txt (no restart)
# Sign-ins:       docker logs -f avatar-signin
# Sign out:       https://<your site>/avatar/oauth2/sign_out
