# Ban addresses that keep failing the avatar's password (fail2ban for nginx
# basic auth), with avatar/authgate. For an nginx that's reachable from the
# internet; the avatar container's own nginx is LAN-only and doesn't need it.
#
# authgate follows nginx's error log for failed logins and bans an address
# after 5 failures in 15 minutes (1 hour; 24 hours if it happens again within
# a day). nginx asks it about every request (auth_request), so a ban starts
# and ends at once, with no reload. A banned address is refused (403) even
# with the right password. If authgate is down, requests go on to the
# password check as before.
#
# Three pieces:

# 1. In the http block. The password applies everywhere except the LAN; this
#    replaces "satisfy any; allow 192.168.0.0/16; ...; auth_basic ..." in the
#    avatar location (that form can't be combined with auth_request: with
#    satisfy any, authgate saying "not banned" would let a visitor in without
#    the password).
geo $avatar_realm {
    default         "Avatar";
    192.168.0.0/16  off;
    127.0.0.1       off;
}

# 2. In the avatar location (avatar-app.conf), instead of the satisfy/allow/
#    deny lines and the fixed auth_basic:
#
#        auth_basic           $avatar_realm;
#        auth_basic_user_file C:/nginx/conf/avatar.htpasswd;

# 3. In the public server block only.
#
#    The visitor's address. Behind CloudFront, nginx sees CloudFront's
#    address; the visitor's is the last one in X-Forwarded-For (CloudFront
#    appends it, so it can't be forged). Trusting it from every source is only
#    safe because this server refuses anything that didn't come through
#    CloudFront (the X-Origin-Verify check). Without a CDN, leave these three
#    lines out.
#
#        set_real_ip_from  0.0.0.0/0;
#        real_ip_header    X-Forwarded-For;
#        real_ip_recursive off;
#
#    Ask authgate about every request; if it can't be reached, carry on.
#
#        auth_request /_authgate;
#        location = /_authgate {
#            internal;
#            proxy_pass http://127.0.0.1:8705/check;
#            proxy_pass_request_body off;
#            proxy_set_header Content-Length "";
#            proxy_set_header X-Real-IP $remote_addr;
#            proxy_connect_timeout 2s;
#            proxy_read_timeout 2s;
#            proxy_intercept_errors on;
#            error_page 500 502 503 504 = @authgate_open;
#        }
#        location @authgate_open { return 204; }
#
# Then: nginx -t, and reload (on Windows, from an admin prompt:
# cd C:\nginx; .\nginx.exe -s reload).
#
# Bans:   curl http://localhost:8705/bans
# Unban:  curl -X POST "http://localhost:8705/unban?ip=1.2.3.4"
# Log:    docker logs -f authgate
