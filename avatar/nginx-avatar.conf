# nginx config for the avatar container (see the `avatar` service in
# docker-compose.yaml). Mounted at /etc/nginx/conf.d/default.conf.
#
# It serves ./avatar/html and proxies the backends under the same origin, so
# the browser never makes a cross-origin call and no CORS setup is needed.
# avatar.html calls these paths relative to the page, the same scheme an
# https nginx in front of the stack would use:
#
#   llama/...  -> llama.cpp            (llama:8000)       chat completions
#   tts/...    -> Kokoro               (kokoro:8880)      speech + word timings
#   a2e/...    -> Audio2Expression     (host :8701)       lip-sync frames
#   stt/...    -> Speaches             (host :8090)       speech-to-text
#   lens/...   -> Lens bridge          (host :8095)       notebook tools
#
# Each prefix is stripped before the request goes upstream, so
# /llama/v1/chat/completions reaches llama as /v1/chat/completions.

server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index avatar.html index.html;

    # Docker's embedded DNS. llama and kokoro are looked up per request
    # through variables, so nginx still starts when either one is down.
    # host.docker.internal comes from /etc/hosts (extra_hosts in compose),
    # which this resolver can't see, so those upstreams stay static.
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $llama  llama:8000;
    set $kokoro kokoro:8880;

    # Voice clips for speech-to-text and lip sync.
    client_max_body_size 25m;

    location / {
        try_files $uri $uri/ =404;
    }

    location /avatars/ {
        # Re-exporting an avatar under the same name should show up right away.
        add_header Cache-Control "no-cache";
    }

    # Site settings are re-read on every page load.
    location = /avatar-config.json {
        add_header Cache-Control "no-store";
    }

    location /llama/ {
        rewrite ^/llama/(.*)$ /$1 break;
        proxy_pass http://$llama;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # If llama runs with LLAMA_API_KEY, either enter the key in the page's
        # Setup, or uncomment this so it stays on the server. Anyone who can
        # reach port 8702 can then use llama.
        # proxy_set_header Authorization "Bearer YOUR_LLAMA_API_KEY";
        # Streaming (SSE) chat completions.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
    }

    location /tts/ {
        rewrite ^/tts/(.*)$ /$1 break;
        proxy_pass http://$kokoro;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # Audio2Expression runs in a conda env on the host, not in Compose.
    location /a2e/ {
        proxy_pass http://host.docker.internal:8701/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
    }

    # Speaches (speech-to-text), through its published host port.
    location /stt/ {
        proxy_pass http://host.docker.internal:8090/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
    }

    # Lens bridge, through its published host port. Notebook runs can take
    # minutes. If the bridge needs a key, enter it in the page's Setup or set
    # it here like the llama block above.
    location /lens/ {
        proxy_pass http://host.docker.internal:8095/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 600s;
    }
}
