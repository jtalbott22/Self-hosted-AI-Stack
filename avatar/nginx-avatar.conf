# nginx config for the avatar container (see the `avatar` service in
# docker-compose.yaml). Mounted at /etc/nginx/conf.d/default.conf.
#
# It serves ./avatar/html and proxies the backends under the same origin, so
# the browser never makes a cross-origin call and no CORS setup is needed.
# Point avatar.html at these relative paths:
#
#   /a2e              -> LAM_Audio2Expression server on the host (:8701)
#   /v1/audio/speech  -> Kokoro TTS (kokoro:8880)
#   /v1/chat/...      -> llama.cpp (llama:8000)
#
# Absolute URLs such as http://localhost:8880 still work; they just bypass
# these proxies.

server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index avatar.html index.html;

    # Docker's embedded DNS. kokoro and llama are looked up per request
    # through variables, so nginx still starts when either one is down.
    # (host.docker.internal comes from /etc/hosts via extra_hosts, which this
    # resolver can't see, so the /a2e upstream below stays static.)
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $kokoro kokoro:8880;
    set $llama  llama:8000;

    # Avatar bundles run to tens of MB.
    client_max_body_size 50m;

    location / {
        try_files $uri $uri/ =404;
    }

    location /avatars/ {
        # Re-exporting an avatar under the same name should show up right away.
        add_header Cache-Control "no-cache";
    }

    # Audio2Expression runs in a conda env on the host, not in Compose.
    # host.docker.internal is mapped to the host by extra_hosts in compose.
    location /a2e {
        proxy_pass http://host.docker.internal:8701;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
        proxy_request_buffering off;
    }

    location /v1/audio/ {
        proxy_pass http://$kokoro;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_buffering off;
    }

    location /v1/ {
        proxy_pass http://$llama;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Streaming (SSE) chat completions.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
    }
}
