# Self-hosted local AI stack
#
# Host directories are relative to this repository:
#   models/       LLM weights
#   comfy/        ComfyUI application data
#   comfy-models/ ComfyUI model files
#   notebooks/    Jupyter notebooks
#   searxng/      SearXNG configuration
#
# Secrets come from .env. See .env.example.
#
# Sparkboard is optional. If you don't want it, remove the sparkboard service
# and its sparkboard-data volume, and remove the sparkboard directory.

services:
  llama:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: llama
    runtime: nvidia
    ports: ["8000:8000"]
    environment:
      - LLAMA_API_KEY=${LLAMA_API_KEY:-}
    volumes:
      - ./models:/models
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 300s
    # -ngl 99 keeps attention on the GPU.
    # --n-cpu-moe 999 pushes MoE experts to system RAM, useful for large
    # models that exceed available VRAM.
    command: >
      -m /models/Qwen3.6-35B-A3B-UD-Q4_K_XL.gguf
      --mmproj /models/mmproj-F16.gguf
      --host 0.0.0.0 --port 8000 --alias qwen
      -c 131072 -np 1
      -ngl 99 --n-cpu-moe 999
      -t 8 -tb 16
      -b 4096 -ub 2048
      --cache-reuse 256
      -fa on
      --cache-type-k q8_0 --cache-type-v q8_0
      --jinja --reasoning off
      --load-mode none
    restart: unless-stopped

  comfyui:
    image: yanwk/comfyui-boot:cu128-slim
    container_name: comfyui
    runtime: nvidia
    ports: ["8188:8188"]
    volumes:
      - ./comfy:/root
      - ./comfy-models:/root/ComfyUI/models
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility,graphics
      # Leave some VRAM available for the LLM.
      - CLI_ARGS=--listen 0.0.0.0 --reserve-vram 0.6
    restart: unless-stopped

  # ----------------------------------------------------------------
  # Sparkboard is optional. It provides local system/container metrics
  # and an optional activity feed for the AI stack.
  sparkboard:
    build: ./sparkboard
    container_name: sparkboard
    runtime: nvidia
    ports: ["9102:9102"]
    pid: host
    cap_add: [SYS_PTRACE]
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=utility
      - HOST_LABEL=${HOST_LABEL:-AI-Workstation}
      - SAMPLE_INTERVAL=${SAMPLE_INTERVAL:-2}
      - SERVICES_INTERVAL=${SERVICES_INTERVAL:-10}
      - RETENTION_DAYS=${RETENTION_DAYS:-120}
      - HOST_PROC=/host/proc
      - DB_PATH=/data/metrics.db
      # Linux/WSL disk paths. Adjust or remove for non-WSL Linux systems.
      - "DISK_PATHS=${DISK_PATHS:-/=Linux}"
      # Optional activity feed:
      # - SPARKBOARD_PROXY=1
      # - SPARKBOARD_VLLM_UPSTREAM=http://llama:8000
      # - SPARKBOARD_CLASSIFY_SAMPLE=0.5
      # - SPARKBOARD_CLASSIFY_CONCURRENCY=1
    volumes:
      - sparkboard-data:/data
      - /proc:/host/proc:ro
      # Read-only Docker socket is enough for Sparkboard's container metrics.
      # Note: Docker socket access is still security-sensitive.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Optional WSL Windows-volume monitoring. Remove these on native Linux.
      - /mnt/c:/host/disks/c:ro
      - /mnt/d:/host/disks/d:ro
    restart: unless-stopped
  # ----------------------------------------------------------------

  postgres:
    image: pgvector/pgvector:pg17
    container_name: postgres
    environment:
      - POSTGRES_USER=openwebui
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=openwebui
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openwebui -d openwebui"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  tika:
    image: apache/tika:latest-full
    container_name: tika
    restart: unless-stopped

  playwright:
    # Keep this version aligned with the Playwright package expected by the
    # Open WebUI image. Check with:
    #   docker exec openwebui pip show playwright | grep Version
    image: mcr.microsoft.com/playwright:v1.60.0-noble
    container_name: playwright
    command: npx -y playwright@1.60.0 run-server --port 3000 --host 0.0.0.0
    restart: unless-stopped

  kokoro:
    image: ghcr.io/remsky/kokoro-fastapi-cpu:latest
    container_name: kokoro
    ports: ["8880:8880"]
    restart: unless-stopped

  jupyter:
    image: quay.io/jupyter/scipy-notebook:latest
    container_name: jupyter
    ports: ["8888:8888"]
    volumes:
      - ./notebooks:/home/jovyan/work
    command: >
      start-notebook.py
      --IdentityProvider.token=${JUPYTER_TOKEN}
      --ServerApp.ip=0.0.0.0
      --ServerApp.allow_origin=*
      --ServerApp.disable_check_xsrf=True
    restart: unless-stopped

  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    ports: ["8080:8080"]
    volumes:
      - ./searxng:/etc/searxng
    environment:
      - SEARXNG_BASE_URL=http://localhost:8080/
      - SEARXNG_SETTINGS_PATH=/etc/searxng/settings.yml
    restart: unless-stopped

  open-terminal:
    # This service gives Open WebUI a shell/filesystem. Treat it as a
    # trusted-user component; do not publish its API port.
    image: ghcr.io/open-webui/open-terminal:0.12.3
    container_name: open-terminal
    environment:
      - OPEN_TERMINAL_API_KEY=${OPEN_TERMINAL_API_KEY}
    volumes:
      - open-terminal:/home/workspace
    restart: unless-stopped

  openwebui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: openwebui
    ports: ["3000:8080"]
    volumes:
      - openwebui-data:/app/backend/data
    environment:
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY}
      # Set this only if you put Open WebUI behind a reverse proxy.
      - WEBUI_URL=${WEBUI_URL:-http://localhost:3000}
      - OPENAI_API_BASE_URL=http://llama:8000/v1
      - OPENAI_API_KEY=none
      - ENABLE_OLLAMA_API=false

      # Database
      - DATABASE_URL=postgresql://openwebui:${POSTGRES_PASSWORD}@postgres:5432/openwebui
      - VECTOR_DB=pgvector
      - PGVECTOR_DB_URL=postgresql://openwebui:${POSTGRES_PASSWORD}@postgres:5432/openwebui
      - DATABASE_POOL_SIZE=10
      - DATABASE_POOL_MAX_OVERFLOW=20

      # Code execution + interpreter
      - ENABLE_CODE_EXECUTION=true
      - CODE_EXECUTION_ENGINE=jupyter
      - CODE_EXECUTION_JUPYTER_URL=http://jupyter:8888
      - CODE_EXECUTION_JUPYTER_AUTH=token
      - CODE_EXECUTION_JUPYTER_AUTH_TOKEN=${JUPYTER_TOKEN}
      - ENABLE_CODE_INTERPRETER=true
      - CODE_INTERPRETER_ENGINE=jupyter
      - CODE_INTERPRETER_JUPYTER_URL=http://jupyter:8888
      - CODE_INTERPRETER_JUPYTER_AUTH=token
      - CODE_INTERPRETER_JUPYTER_AUTH_TOKEN=${JUPYTER_TOKEN}

      # Speech
      - AUDIO_TTS_ENGINE=openai
      - AUDIO_TTS_OPENAI_API_BASE_URL=http://kokoro:8880/v1
      - AUDIO_TTS_OPENAI_API_KEY=none
      - AUDIO_TTS_MODEL=kokoro
      - AUDIO_TTS_VOICE=af_sky
      - AUDIO_TTS_SPLIT_ON=punctuation
      - WHISPER_MODEL=base.en

      # Images
      - ENABLE_IMAGE_GENERATION=true
      - IMAGE_GENERATION_ENGINE=comfyui
      - COMFYUI_BASE_URL=http://comfyui:8188
      - IMAGE_SIZE=1024x1024
      - IMAGE_STEPS=25

      # RAG
      - CONTENT_EXTRACTION_ENGINE=tika
      - TIKA_SERVER_URL=http://tika:9998
      - RAG_EMBEDDING_MODEL=BAAI/bge-m3
      - ENABLE_RAG_HYBRID_SEARCH=true
      - RAG_RERANKING_MODEL=BAAI/bge-reranker-v2-m3
      - CHUNK_SIZE=1200
      - CHUNK_OVERLAP=150
      - RAG_TOP_K=6

      # Web search + page loading
      - ENABLE_WEB_SEARCH=true
      - WEB_SEARCH_ENGINE=searxng
      - SEARXNG_QUERY_URL=http://searxng:8080/search?q=<query>&format=json
      - WEB_SEARCH_RESULT_COUNT=5
      - WEB_SEARCH_CONCURRENT_REQUESTS=5
      - WEB_LOADER_ENGINE=playwright
      - PLAYWRIGHT_WS_URL=ws://playwright:3000
      - PLAYWRIGHT_TIMEOUT=10000

      # Disable background generation to reduce token/compute overhead.
      - ENABLE_TITLE_GENERATION=false
      - ENABLE_TAGS_GENERATION=false
      - ENABLE_FOLLOW_UP_GENERATION=false
      - ENABLE_AUTOCOMPLETE_GENERATION=false

    depends_on:
      postgres:
        condition: service_healthy
      llama:
        condition: service_healthy
      tika:
        condition: service_started
      jupyter:
        condition: service_started
      searxng:
        condition: service_started
      playwright:
        condition: service_started
      open-terminal:
        condition: service_started
      kokoro:
        condition: service_started
    restart: unless-stopped

volumes:
  openwebui-data:
  pgdata:
  open-terminal:
  sparkboard-data:
