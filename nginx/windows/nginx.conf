worker_processes 1;
events { worker_connections 1024; }
http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    client_max_body_size 512M;

    # Redirects nginx issues itself (/avatar -> /avatar/) stay relative.
    # Behind CloudFront the Host header is origin.example.com, and an absolute
    # redirect would bounce visitors off www.example.com onto it.
    absolute_redirect off;

    # Rate limit for the inference API. llama serves only a couple of requests
    # at a time -- a caller that pipelines requests doesn't go faster, it just
    # queues, and while it queues nobody else gets a token. This caps the
    # damage a single source can do.
    limit_req_zone $binary_remote_addr zone=llama:10m rate=20r/m;

    # The avatar's password applies everywhere except the LAN ("off" turns
    # auth_basic off). Used by avatar-app.conf; see the authgate notes below.
    geo $avatar_realm {
        default         "Avatar";
        192.168.0.0/16  off;
        127.0.0.1       off;
    }

    # ======================================================= lan.example.com
    # LAN hostname (resolves to 192.168.x). First server = default server.
    server {
        listen 443 ssl;
        server_name lan.example.com;

        ssl_certificate     C:/nginx-certs/lan.example.com-chain.pem;
        ssl_certificate_key C:/nginx-certs/lan.example.com-key.pem;

        location / {
            proxy_pass http://127.0.0.1:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
        }

        # Avatar page + its services under /avatar/ (shared with origin.example.com).
        # Replaces the old "location /avatar/ { alias ... }".
        include avatar-app.conf;

        # The original top-level service paths stay for anything else that
        # uses them (and for the avatar page until it's switched to relative
        # paths).
        location /stt/ {
            proxy_pass http://127.0.0.1:8090/;
            client_max_body_size 25M;
            allow 192.168.0.0/16;
            allow 127.0.0.1;
            deny  all;
        }
        location /a2e/ {
            proxy_pass http://127.0.0.1:8701/;
            client_max_body_size 20m;
            proxy_read_timeout 60s;
            # LAN only: the public avatar uses /avatar/a2e/ behind sign-in.
            allow 192.168.0.0/16;
            allow 127.0.0.1;
            deny  all;
        }
        # Lens bridge for the avatar page. Notebook runs can take minutes.
        location /lens/ {
            proxy_pass http://127.0.0.1:8095/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
            client_max_body_size 25M;
            allow 192.168.0.0/16;
            allow 127.0.0.1;
            deny  all;
        }
        # ------------------------------------------------ llama.cpp over TLS
        #
        # Base URL for clients:  https://lan.example.com/llama/v1
        #
        # The trailing slash on proxy_pass strips the /llama/ prefix, so
        # /llama/v1/chat/completions arrives at llama as /v1/chat/completions.
        #
        # Authentication is llama's own --api-key, not nginx's. That covers the
        # docker network and the LAN too, rather than only the requests that
        # happen to arrive through here. The Authorization header is passed
        # through untouched -- which is also why basic auth is NOT used on this
        # location: it claims the same header and would break every OpenAI
        # client pointed at it.
        # Through Sparkboard's model director, which loads/boosts/parks the
        # models on demand (sparkboard/app/director.py in this repo). To bypass it,
        # point this back at http://127.0.0.1:8000/.
        location /llama/ {
            proxy_pass http://127.0.0.1:9102/llm/qwen/;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            # Token streaming is server-sent events. Buffering off is what
            # makes tokens arrive as they are generated rather than in one lump
            # at the end; the read timeout is what stops nginx closing the
            # connection during a long first-token wait on a 35B MoE with
            # experts spilled to system RAM.
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
            chunked_transfer_encoding off;

            limit_req zone=llama burst=10 nodelay;
            # LAN only: the avatar page reaches llama through /avatar/llama/ instead.
            allow 192.168.0.0/16;
            allow 127.0.0.1;
            deny  all;
        }
        # ----------------------------------- Inkling (optional second model)
        # Base URL: https://lan.example.com/inkling/v1  (same llama key).
        # LAN only. Remove this block if the llama-inkling service goes away.
        location /inkling/ {
            proxy_pass http://127.0.0.1:9102/llm/inkling/;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
            chunked_transfer_encoding off;
            limit_req zone=llama burst=10 nodelay;
            allow 192.168.0.0/16;
            allow 127.0.0.1;
            deny  all;
        }
        # Kokoro's voice tuner saves voices on this machine. This host sits
        # behind NAT, so only the LAN reaches it, but nothing here needs it:
        # the avatar page learns voices through /avatar/tts/, behind its login.
        location /tts/dev/tune { return 403; }
        location /tts/ {
            proxy_pass http://127.0.0.1:8880/;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            # Streamed audio: buffering off so chunks go out as Kokoro makes
            # them; long timeouts so nginx doesn't cut a long synthesis.
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
            chunked_transfer_encoding off;
            # allow 192.168.0.0/16;
            # allow 127.0.0.1;
            # deny  all;
        }

        location = /sparkboard { return 301 /sparkboard/; }

        location /sparkboard/ {
            # The trailing slash matters: it makes nginx strip the /sparkboard/
            # prefix before forwarding. Every asset and API path in the
            # dashboard is requested relatively, so it doesn't care what prefix
            # it's mounted under.
            proxy_pass http://127.0.0.1:9102/;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Forwarded-Proto $scheme;

            # The live view is server-sent events, and an SSE connection is
            # idle by design between samples. proxy_buffering off is what stops
            # nginx holding the stream; proxy_read_timeout is what stops it
            # closing an idle one. Without the timeout the default 60s applies
            # and the live view hitches once a minute -- EventSource reconnects
            # on its own, so it looks like a stall rather than a break, which
            # is harder to place.
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 24h;
            chunked_transfer_encoding off;

            # Sparkboard has no authentication of its own, and this hostname
            # has a public cert on it. The ports table is a live map of every
            # container, every listening port, and the command line of each
            # process holding one -- reconnaissance output, formatted nicely.
            # Open WebUI at / has its own login; this has nothing.
            #
            # Adjust to your LAN, or swap for basic auth:
            #     auth_basic "Sparkboard";
            #     auth_basic_user_file C:/nginx/conf/sparkboard.htpasswd;
            allow 192.168.0.0/16;
            allow 127.0.0.1;
            deny  all;
        }
    }

    # ======================================================== origin.example.com
    # Public hostname kept pointed at the WAN IP by the Route 53 DDNS task.
    # Its only client is CloudFront (www.example.com, behavior /avatar*),
    # and it serves nothing but the avatar.
    server {
        listen 443 ssl;
        server_name origin.example.com;

        # Same win-acme cert, reissued with origin.example.com as a SAN.
        ssl_certificate     C:/nginx-certs/lan.example.com-chain.pem;
        ssl_certificate_key C:/nginx-certs/lan.example.com-key.pem;

        # CloudFront adds this header on every origin request. Anything without
        # it went around CloudFront -- straight at the WAN IP -- and is refused.
        if ($http_x_origin_verify != "<CLOUDFRONT_ORIGIN_SECRET>") {
            return 403;
        }

        # Brute-force protection (authgate, a container in the WSL stack, see
        # avatar/nginx-authgate.conf in the repo). It follows logs/error.log for
        # failed logins and bans an address after 5 in 15 minutes (1 h; 24 h if
        # again within a day). Every request asks it first, so bans start and
        # end without a reload; a banned address gets 403 even with the right
        # password. If authgate is down, requests go on to the password as before.
        #
        # The visitor's address: CloudFront appends it last to X-Forwarded-For,
        # so it can't be forged, and only CloudFront gets past the check above.
        set_real_ip_from  0.0.0.0/0;
        real_ip_header    X-Forwarded-For;
        real_ip_recursive off;

        auth_request /_authgate;
        location = /_authgate {
            internal;
            proxy_pass http://127.0.0.1:8705/check;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_connect_timeout 2s;
            proxy_read_timeout 2s;
            proxy_intercept_errors on;
            error_page 500 502 503 504 = @authgate_open;
        }
        location @authgate_open { return 204; }

        include avatar-app.conf;

        location / { return 404; }
    }
}
