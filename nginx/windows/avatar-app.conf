# avatar-app.conf -- included by both server blocks in nginx.conf.
#
# Everything the avatar page needs lives under /avatar/, so the page works the
# same from lan.example.com (LAN), origin.example.com (CloudFront origin), and
# www.example.com/avatar/ (CloudFront's /avatar* behavior). The page
# must call its services RELATIVELY -- "tts/...", not "/tts/..." -- so that
# from /avatar/avatar.html they resolve to /avatar/tts/... on every hostname.

location = /avatar { return 301 /avatar/; }

# Signing in with Google, for everyone not on the LAN (avatar-signin, an
# oauth2-proxy container in the WSL stack, :4180; see
# avatar/nginx-google-signin.conf in the repo). Only the Google accounts in
# its allowed-emails.txt get in. Not signed in: off to Google, then back.
location @avatar_signin {
    return 302 /avatar/oauth2/start?rd=$request_uri;
}

location /avatar/ {
    # LAN walks straight in; everyone else needs a Google sign-in -- and that
    # includes all CloudFront traffic (the public server sets the address to
    # the visitor's, from X-Forwarded-For). Nested locations below inherit
    # this, so one gate covers the page and every service behind it.
    # (This auth_request replaces the public server's authgate check here:
    # with no password left, there's nothing to brute-force.)
    satisfy any;
    allow 192.168.0.0/16;
    allow 127.0.0.1;
    deny  all;
    auth_request /avatar/oauth2/auth;
    auth_request_set $avatar_user $upstream_http_x_auth_request_email;
    error_page 401 = @avatar_signin;

    # Saved chats (avatar-chats, :8706), per Google account. X-Avatar-User is
    # always set here, from the sign-in, so a browser can't claim someone
    # else's; on the LAN it's empty and the service files chats as its owner.
    location /avatar/chats/ {
        proxy_pass http://127.0.0.1:8706/chats/;
        proxy_set_header X-Avatar-User $avatar_user;
        proxy_set_header Authorization "";
        client_max_body_size 8m;
    }
    # Home control (avatar-home, :8707): passes commands to Home Assistant.
    # Only the owner's Google account (and the LAN) may use it; the service
    # checks X-Avatar-User, which is always set here from the sign-in.
    location /avatar/home/ {
        proxy_pass http://127.0.0.1:8707/;
        proxy_set_header X-Avatar-User $avatar_user;
        proxy_set_header Authorization "";
        proxy_read_timeout 130s;
    }
    location = /avatar/chats/me {
        proxy_pass http://127.0.0.1:8706/me;
        proxy_set_header X-Avatar-User $avatar_user;
        proxy_set_header Authorization "";
    }

    # The sign-in pages themselves, and the check nginx makes per request.
    location /avatar/oauth2/ {
        allow all;
        auth_request off;
        proxy_pass http://127.0.0.1:4180;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header Authorization     "";
    }
    location = /avatar/oauth2/auth {
        internal;
        allow all;
        auth_request off;
        proxy_pass http://127.0.0.1:4180;
        proxy_pass_request_body off;
        proxy_set_header Content-Length    "";
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Uri   $request_uri;
        proxy_set_header Authorization     "";
    }

    alias C:/nginx/html/avatar/;
    index avatar.html;

    # The page itself: always ask for a newer copy. Without this, phones (a
    # home-screen copy especially) and CloudFront keep running an old version
    # for a while after an update. It's checked, not re-sent, when unchanged.
    location ~ ^/avatar/[^/]*\.html$ {
        add_header Cache-Control "no-cache" always;
    }

    # Each proxied location clears Authorization, so the browser's basic-auth
    # credentials never reach the backends.

    # Kokoro TTS (streamed audio)
    location /avatar/tts/ {
        proxy_pass http://127.0.0.1:8880/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header Authorization     "";
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        chunked_transfer_encoding off;
    }

    # Speech-to-text
    location /avatar/stt/ {
        proxy_pass http://127.0.0.1:8090/;
        proxy_set_header Authorization "";
        client_max_body_size 25M;
    }

    # Audio2Expression lip sync
    location /avatar/a2e/ {
        proxy_pass http://127.0.0.1:8701/;
        proxy_set_header Authorization "";
        client_max_body_size 20m;
        proxy_read_timeout 60s;
    }

    # Avatar maker (avatar_maker.py in WSL, :8703): Setup's "New avatar from
    # a photo". Uploads a photo; the finished avatars/<name>.zip is written
    # into C:/nginx/html/avatar/avatars by the lam-maker service. The page
    # polls for progress, so no request runs anywhere near CloudFront's 60s.
    location /avatar/make/ {
        proxy_pass http://127.0.0.1:8703/;
        proxy_http_version 1.1;
        proxy_set_header Host          $host;
        proxy_set_header Authorization "";
        client_max_body_size 16m;
        proxy_read_timeout 60s;
    }

    # Music service (the `music` container, localhost:8704): search and the
    # audio itself. Radio streams never end, so no buffering and a long read
    # timeout; data keeps flowing, so CloudFront's 60s limit doesn't apply.
    location /avatar/music/ {
        proxy_pass http://127.0.0.1:8704/;
        proxy_http_version 1.1;
        proxy_set_header Host          $host;
        proxy_set_header Authorization "";
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    # Lens bridge. Notebook runs can take minutes -- but CloudFront gives up
    # at its origin response timeout (60s max without a quota increase), so
    # long runs only finish on the LAN path.
    location /avatar/lens/ {
        proxy_pass http://127.0.0.1:8095/;
        proxy_http_version 1.1;
        proxy_set_header Host          $host;
        proxy_set_header Authorization "Bearer <LENS_BRIDGE_KEY>";
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        client_max_body_size 25M;
    }

    # llama.cpp for the avatar's own chat calls. nginx swaps the browser's
    # basic-auth header for the llama key, so the key lives here and never
    # ships in avatar.html. Delete this block if the page talks to Open WebUI
    # instead of llama directly.
    location /avatar/llama/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header Authorization     "Bearer <LLAMA_API_KEY>";
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        chunked_transfer_encoding off;

        # Through CloudFront, $binary_remote_addr is the edge's address, not
        # the viewer's, so this acts as a shared limit for remote use.
        limit_req zone=llama burst=10 nodelay;
    }
}
