  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      --color-paper: #0f1420;

      --color-ink: #e8eaed;
      --color-ink-strong: #111111;
      --color-muted: #8b92a8;
      --color-soft: #6b7490;

      --color-accent: #e09140;
      --color-accent-tint: rgba(224,145,64,0.07);
      --color-link: #5a8fd4;
      --color-cyan: #3ecfb2;
      --color-teal: #28a89a;
      --color-violet: #9b7ed8;
      --color-violet-tint: rgba(155,126,216,0.06);
      --color-amber: #e8a838;

      --color-amber-border: rgba(232,168,56,0.50);
      --font-sans: 'Geist', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .frame { max-width: 1600px; width: 100%; }
    .header { margin-bottom: 1.25rem; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.65rem;
      font-weight: 500;
      letter-spacing: 0.20em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.4rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.4rem, 2vw + 0.5rem, 1.85rem);
      font-weight: 400;
      letter-spacing: -0.01em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 0.35rem;
    }
    .subtitle {
      font-family: var(--font-mono);
      font-size: 0.68rem;
      font-weight: 400;
      color: var(--color-soft);
      letter-spacing: 0.06em;
    }
    svg { width: 100%; min-width: 1100px; display: block; }
